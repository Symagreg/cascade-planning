<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cascade Planning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept : outil de terrain pour téléphone. Une colonne, gros boutons, couleur = action (départ/ménage en ambre, arrivée en vert sapin). */
:root{
  --bg:#F4F5F1; --card:#FFFFFF; --ink:#16201A; --soft:#5A655E; --line:#DDE1D9;
  --pine:#1F4A33; --pine-ink:#FFFFFF; --pine-tint:#DCEBDD;
  --amber:#8A4B08; --amber-tint:#FBE7C6; --new:#0B5CAD; --new-tint:#DCEBFA; --bad:#9B1C1C; --bad-tint:#F9DADA;
  --focus:#0B5CAD; --shadow:0 1px 2px rgba(20,30,25,.08);
  --f:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --card:#18211B; --ink:#EEF2EC; --soft:#A2AEA5; --line:#2B362E;
  --pine:#7CC79A; --pine-ink:#0F1511; --pine-tint:#1F3A2A;
  --amber:#F2B45E; --amber-tint:#3A2A12; --new:#8DBBF2; --new-tint:#14304F; --bad:#F29A9A; --bad-tint:#431B1B;
  --focus:#8DBBF2; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --card:#18211B; --ink:#EEF2EC; --soft:#A2AEA5; --line:#2B362E;
  --pine:#7CC79A; --pine-ink:#0F1511; --pine-tint:#1F3A2A;
  --amber:#F2B45E; --amber-tint:#3A2A12; --new:#8DBBF2; --new-tint:#14304F; --bad:#F29A9A; --bad-tint:#431B1B;
  --focus:#8DBBF2; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.demo{margin:0 -16px;padding:8px 16px;background:var(--amber-tint);color:var(--amber);font-size:.8rem;font-weight:600;text-align:center}
/* verrou */
.lock{min-height:80svh;display:grid;align-content:center;gap:18px;max-width:420px;margin:0 auto}
.lock h1{font-size:1.9rem;line-height:1.1;margin:0}
.lock p{margin:0;color:var(--soft)}
.lock input{width:100%;min-height:56px;font-size:1.4rem;letter-spacing:.3em;text-align:center;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px}
.btn{min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--pine);color:var(--pine-ink);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
/* app */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
header.top h1{font-size:1.5rem;line-height:1.1;margin:0}header.top h1::first-letter,.day h3::first-letter,.mnav b::first-letter{text-transform:uppercase}
header.top small{display:block;color:var(--soft);font-size:.78rem}
.tools{display:flex;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.1rem}
main{display:grid;gap:18px;padding-top:16px}
section.blk{display:grid;gap:10px}
section.blk>h2{margin:0;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:8px}
.cnt{min-width:24px;height:24px;border-radius:12px;display:inline-grid;place-items:center;font-size:.8rem;letter-spacing:0;background:var(--line);color:var(--ink)}
.cnt.a{background:var(--amber-tint);color:var(--amber)}.cnt.g{background:var(--pine-tint);color:var(--pine)}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:4px;min-width:0}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:start}
.item b{font-size:1.08rem;line-height:1.25}
.item .s{color:var(--soft);font-size:.92rem}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.tag.a{background:var(--amber-tint);color:var(--amber)}.tag.g{background:var(--pine-tint);color:var(--pine)}.tag.n{background:var(--new-tint);color:var(--new)}.tag.x{background:var(--bad-tint);color:var(--bad)}
.item.dep{border-left:6px solid var(--amber)}.item.arr{border-left:6px solid var(--pine)}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:16px;color:var(--soft)}
.wa{width:100%}
/* semaine */
.day{display:grid;gap:8px}
.day h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{font-size:.8rem;color:var(--soft);font-weight:400;text-transform:none}
.day.today h3{color:var(--pine)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left}
.row i{font-style:normal;font-weight:800;width:1.6em;text-align:center}
.row.d i{color:var(--amber)}.row.a i{color:var(--pine)}
.row span{min-width:0;flex:1;overflow-wrap:anywhere}
/* mois */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-size:1.1rem}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-inline:-4px}
.grid{position:relative;display:grid;grid-template-columns:84px repeat(var(--n),38px);min-width:max-content}
.grid>div{border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 55%,transparent);display:grid;place-items:center;font-size:.72rem;min-height:30px}
.grid .lg{position:sticky;left:0;background:var(--card);z-index:3;font-weight:700;font-size:.78rem;justify-items:start;padding-left:8px;min-height:52px;border-right:1px solid var(--line)}
.grid .hd{min-height:36px;color:var(--soft);line-height:1.1;text-align:center}
.grid .hd.we{background:color-mix(in srgb,var(--line) 40%,transparent)}
.grid .hd.td{background:var(--pine);color:var(--pine-ink);font-weight:800}
.grid .cell{min-height:52px}
.rowbar{grid-column:2/-1;position:relative;min-height:52px;border-bottom:1px solid var(--line)}
.bar{position:absolute;top:7px;bottom:7px;border-radius:9px;background:var(--pine-tint);border:1.5px solid var(--pine);color:var(--ink);font-size:.74rem;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-align:left;min-width:0}
.bar.alt{background:var(--amber-tint);border-color:var(--amber)}
.bar.nw{box-shadow:0 0 0 2px var(--new)}
.legend{font-size:.8rem;color:var(--soft)}
/* barre du bas */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;min-height:56px;border-radius:12px;display:grid;place-items:center;gap:0;font-size:.78rem;font-weight:700;color:var(--soft)}
nav.tabs button b{font-size:1.25rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--pine);background:var(--pine-tint)}
/* fiche */
dialog{border:0;padding:0;background:transparent;max-width:none;width:100%;height:100%;margin:0;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92svh;overflow:auto;max-width:560px;margin-inline:auto}
.sheet h2{margin:0;font-size:1.4rem;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--soft)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.phone{font-size:1.5rem;font-weight:800;letter-spacing:.02em;user-select:all}
.acts{display:grid;gap:10px}
@media (prefers-reduced-motion:no-preference){.item,.row{transition:transform .12s}.item:active,.row:active{transform:scale(.985)}}
</style>

const $=(s,r=document)=>r.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let D=null, view='count', cur=null, month=null, mm=null;
const fr=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const frS=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const frM=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const nights=r=>Math.round((pd(r.dep)-pd(r.arr))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=id=>D.logements.find(l=>l.id===id);
const act=()=>D.res.filter(r=>!r.cancel);
let today=iso(new Date());

function lockScreen(msg){
  $('#app').innerHTML=`  <form class="lock" id="f"><h1>Planning<br>Cascade</h1><p>Entre le code d'accès.</p>
  <input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Code d'accès" placeholder="••••" autofocus>
  <div class="err" id="err" role="alert">${msg||''}</div>
  <button class="btn" type="submit">Ouvrir le planning</button></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const c=$('#code').value;if(!c)return;
    try{
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(c),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));
      D=JSON.parse(new TextDecoder().decode(pt)); start();
    }catch(x){ $('#err').textContent=(window.crypto&&crypto.subtle)?'Code incorrect.':'Ce navigateur ne permet pas le déchiffrement.'; }
  };
}
function start(){
  const lo=iso(new Date(Math.min(...D.res.map(r=>+pd(r.arr))))), hi=iso(new Date(Math.max(...D.res.map(r=>+pd(r.dep)))));
  if(today<lo||today>hi) today=lo;
  month=today.slice(0,7); mm=(+today.slice(8)>=25)?iso(new Date(+today.slice(0,4),+today.slice(5,7),1)).slice(0,7):month; render();
}
const upd=()=>{const d=new Date(D.updated);return 'Vérifié dans l’extranet le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':','h')};
function alertHtml(){
  const s=D.sources||{}, old=(Date.now()-new Date(D.updated))>26*36e5;
  if(s.extranet==='perdu') return '<div class="demo" style="background:var(--bad-tint);color:var(--bad)">Connexion à Booking perdue : les réservations peuvent être incomplètes. Le propriétaire est prévenu.</div>';
  if(old) return '<div class="demo" style="background:var(--bad-tint);color:var(--bad)">Planning pas vérifié dans l’extranet depuis plus d’un jour : demande confirmation au propriétaire.</div>';
  return '';
}
function render(){
  const ttl={count:'Réservations du mois',week:'7 prochains jours',msg:'Message du mois'}[view];
  $('#app').innerHTML=`  ${alertHtml()}<header class="top"><div><h1>${esc(ttl)}</h1><small>${upd()}</small></div>
  <div class="tools"><button class="ic" id="lockb" aria-label="Verrouiller">🔒</button></div></header>
  <main id="m"></main>
  <nav class="tabs" role="tablist" aria-label="Vues">
   ${[['count','▦','Ce mois'],['week','▤','Semaine'],['msg','✉','Message']].map(([k,i,t])=>`<button role="tab" aria-selected="${view===k}" data-v="${k}"><b aria-hidden="true">${i}</b>${t}</button>`).join('')}
  </nav><dialog id="dlg"></dialog>`;
  $('#lockb').onclick=()=>{D=null;lockScreen()};
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
  ({count:vCount,week:vWeek,msg:vMsg})[view]();
  $('#m').addEventListener('click',e=>{const t=e.target.closest('[data-r]');if(t)openSheet(t.dataset.r)});
}
const sameDayArr=r=>act().some(x=>x.l===r.l&&x.arr===r.dep);
function card(r,kind){
  const lg=L(r.l);
  return `<button class="item ${kind}" data-r="${r.id}"><div class="t"><b>${esc(lg.nom)}</b><span>${r.new?'<span class="tag n">Nouvelle</span>':''}</span></div>
  <div class="s">${esc(r.nom)} · ${esc(r.pers)} · ${nights(r)} nuit${nights(r)>1?'s':''}</div>
  ${kind==='dep'&&sameDayArr(r)?'<div><span class="tag a">Rotation serrée : arrivée le même jour</span></div>':''}</button>`;
}
function vToday(){
  const A=act(), dep=A.filter(r=>r.dep===today), arr=A.filter(r=>r.arr===today), stay=A.filter(r=>r.arr<today&&r.dep>today);
  const lim=iso(addD(pd(today),30)),chg=D.res.filter(r=>r.new||(r.cancel&&r.arr<=lim&&r.dep>=today));
  const wa=encodeURIComponent('Programme du '+fr.format(pd(today))+'\n\nMénages (départs) :\n'+(dep.length?dep.map(r=>'• '+L(r.l).nom+(sameDayArr(r)?' (arrivée le même jour)':'')).join('\n'):'• aucun')+'\n\nArrivées :\n'+(arr.length?arr.map(r=>'• '+L(r.l).nom+' : '+r.nom+', '+r.pers+' pers.').join('\n'):'• aucune'));
  $('#m').innerHTML=`
  <a class="btn wa" href="https://wa.me/?text=${wa}" target="_blank" rel="noopener">Envoyer le programme sur WhatsApp</a>
  <section class="blk"><h2>Ménages à faire <span class="cnt a">${dep.length}</span></h2>${dep.length?dep.map(r=>card(r,'dep')).join(''):'<div class="empty">Aucun départ aujourd’hui.</div>'}</section>
  <section class="blk"><h2>Arrivées <span class="cnt g">${arr.length}</span></h2>${arr.length?arr.map(r=>card(r,'arr')).join(''):'<div class="empty">Aucune arrivée aujourd’hui.</div>'}</section>
  <section class="blk"><h2>En séjour <span class="cnt">${stay.length}</span></h2>${stay.map(r=>`<button class="row" data-r="${r.id}"><span><b>${esc(L(r.l).nom)}</b><br><small style="color:var(--soft)">${esc(r.nom)} · départ le ${frS.format(pd(r.dep))}</small></span></button>`).join('')||'<div class="empty">Personne en séjour.</div>'}</section>
  <section class="blk"><h2>Changements récents <span class="cnt">${chg.length}</span></h2>${chg.map(r=>`<button class="row" data-r="${r.id}"><span><b>${esc(L(r.l).nom)}</b><br><small style="color:var(--soft)">${esc(r.nom)} · ${frS.format(pd(r.arr))} → ${frS.format(pd(r.dep))}</small></span>${r.cancel?'<span class="tag x" style="flex:none">Annulée</span>':'<span class="tag n" style="flex:none">Nouvelle</span>'}</button>`).join('')||'<div class="empty">Rien de nouveau.</div>'}</section>`;
}
function vWeek(){
  const A=act(); let h='';
  for(let i=0;i<7;i++){
    const ds=iso(addD(pd(today),i)), dep=A.filter(r=>r.dep===ds), arr=A.filter(r=>r.arr===ds);
    h+=`<section class="day ${i===0?'today':''}"><h3>${i===0?'Aujourd’hui':fr.format(pd(ds))}<span>${dep.length} départ${dep.length>1?'s':''} · ${arr.length} arrivée${arr.length>1?'s':''}</span></h3>`+
      dep.map(r=>`<button class="row d" data-r="${r.id}"><i aria-hidden="true">↓</i><span><b>${esc(L(r.l).nom)}</b> : ménage${sameDayArr(r)?' · <span class="tag a">rotation serrée</span>':''}</span></button>`).join('')+
      arr.map(r=>`<button class="row a" data-r="${r.id}"><i aria-hidden="true">↑</i><span><b>${esc(L(r.l).nom)}</b> : ${esc(r.nom)}, ${esc(r.pers)}${r.new?' <span class="tag n">Nouvelle</span>':''}</span></button>`).join('')+
      (!dep.length&&!arr.length?'<div class="empty" style="padding:10px 14px">Rien de prévu.</div>':'')+`</section>`;
  }
  $('#m').innerHTML=h;
}
function vMonth(){
  const [y,mo]=month.split('-').map(Number), n=new Date(y,mo,0).getDate(), first=new Date(y,mo-1,1), A=act();
  const prev=iso(new Date(y,mo-2,1)).slice(0,7), next=iso(new Date(y,mo,1)).slice(0,7);
  let hd='<div class="lg hd" style="min-height:36px"></div>';
  for(let d=1;d<=n;d++){const dt=new Date(y,mo-1,d), ds=iso(dt);hd+=`<div class="hd ${dt.getDay()%6===0?'we':''} ${ds===today?'td':''}">${'dilumamejevesa'.slice(dt.getDay()*2,dt.getDay()*2+2)}<br>${d}</div>`}
  let rows='';
  D.logements.forEach(lg=>{
    rows+=`<div class="lg">${esc(lg.court)}</div><div class="rowbar" style="grid-column:2/-1">`;
    A.filter(r=>r.l===lg.id).forEach((r,k)=>{
      const a=pd(r.arr), d=pd(r.dep); if(d<first||a>new Date(y,mo-1,n))return;
      const ia=Math.max(0,Math.round((a-first)/864e5)), id=Math.min(n,Math.round((d-first)/864e5));
      const left=(a<first?0:ia+.5)*38, right=(d>new Date(y,mo-1,n)?n:id+.5)*38;
      rows+=`<button class="bar ${k%2?'alt':''} ${r.new?'nw':''}" data-r="${r.id}" style="left:${left+1}px;width:${right-left-2}px" aria-label="${esc(lg.nom)} : ${esc(r.nom)}">${esc(r.nom)}</button>`;
    });
    rows+='</div>';
  });
  $('#m').innerHTML=`<div class="mnav"><button class="ic" id="pm" aria-label="Mois précédent">‹</button><b>${frM.format(first)}</b><button class="ic" id="nm" aria-label="Mois suivant">›</button></div>
  <div class="gridwrap" id="gw"><div class="grid" style="--n:${n}">${hd}${rows}</div></div>
  <p class="legend">Chaque barre est un séjour, de l’arrivée au départ. Touche une barre pour ouvrir la fiche. Contour bleu : réservation nouvelle.</p>`;
  $('#pm').onclick=()=>{month=prev;render()}; $('#nm').onclick=()=>{month=next;render()};
  const gw=$('#gw'); if(month===today.slice(0,7)) gw.scrollLeft=Math.max(0,(+today.slice(8)-3)*38);
}

const ORD=[['4','Rdc 2 pièces'],['5','Studio'],['3','Escapade'],['1','115'],['2','115 bis']];
const tel0=t=>t?String(t).replace(/\s/g,'').replace(/^\+33/,'0'):'(téléphone à venir)';
const mn=d=>new Intl.DateTimeFormat('fr-FR',{month:'long'}).format(pd(d));
const dj=s=>String(+s.slice(8))+(+s.slice(8)===1?'er':'');
const pre=r=>r.pre||String(r.nom).split(' ')[0].replace(/^./,c=>c.toUpperCase());
const pp=p=>String(p).replace(/ \([^)]*\)/g,'').replace(/ \+ /g,' ');
function msgText(mk){
  const mm=mn(mk+'-01');
  let t='Resa '+mm;
  ORD.forEach(([id,lab])=>{
    const rs=act().filter(r=>r.l===id&&r.arr.slice(0,7)===mk).sort((a,b)=>a.arr<b.arr?-1:1);
    t+='\n\n'+lab+'\n\n'+(rs.length?rs.map(r=>{
      const a=dj(r.arr)+(r.arr.slice(0,7)===r.dep.slice(0,7)?'':' '+mn(r.arr));
      return 'Du '+a+' au '+dj(r.dep)+' '+mn(r.dep)+' '+pre(r)+' '+pp(r.pers)+' '+tel0(r.tel);
    }).join('\n'):'Pas de resa')+'\n';
  });
  return t.trim();
}
function vCount(){
  const [y,mo]=month.split('-').map(Number), first=new Date(y,mo-1,1);
  const prev=iso(new Date(y,mo-2,1)).slice(0,7), next=iso(new Date(y,mo,1)).slice(0,7);
  const n=id=>act().filter(r=>r.l===id&&r.arr.slice(0,7)===month).length;
  $('#m').innerHTML=`<div class="mnav"><button class="ic" id="pm" aria-label="Mois précédent">‹</button><b>${frM.format(first)}</b><button class="ic" id="nm" aria-label="Mois suivant">›</button></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">`+
  [['4','Rdc 2 pièces'],['5','Studio'],['3','Escapade'],['1','115'],['2','115 bis']].map(([id,lab])=>{const c=n(id);
    return `<div style="background:${c?'var(--pine-tint)':'var(--card)'};border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;display:grid;gap:6px"><div style="font-size:3rem;font-weight:800;line-height:1;color:${c?'var(--pine)':'var(--soft)'}">${c}</div><div style="font-weight:700">${lab}</div><small style="color:var(--soft)">réservation${c>1?'s':''}</small></div>`}).join('')+`</div>`;
  $('#pm').onclick=()=>{month=prev;render()}; $('#nm').onclick=()=>{month=next;render()};
}
function vMsg(){
  const [y,mo]=mm.split('-').map(Number), first=new Date(y,mo-1,1);
  const prev=iso(new Date(y,mo-2,1)).slice(0,7), next=iso(new Date(y,mo,1)).slice(0,7), txt=msgText(mm);
  const miss=act().filter(r=>r.arr.slice(0,7)===mm&&!r.tel).length;
  $('#m').innerHTML=`<div class="mnav"><button class="ic" id="pm" aria-label="Mois précédent">‹</button><b>${frM.format(first)}</b><button class="ic" id="nm" aria-label="Mois suivant">›</button></div>
  <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
  <button class="btn ghost" id="cpm">Copier le message</button>
  ${miss?`<p class="legend">${miss} réservation${miss>1?'s':''} sans numéro de téléphone pour l’instant.</p>`:''}
  <pre id="mt" style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;margin:0">${esc(txt)}</pre>`;
  $('#pm').onclick=()=>{mm=prev;render()}; $('#nm').onclick=()=>{mm=next;render()};
  $('#cpm').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cpm').textContent='Message copié'}catch(e){const g=getSelection(),r=document.createRange();r.selectNodeContents($('#mt'));g.removeAllRanges();g.addRange(r);$('#cpm').textContent='Message sélectionné'}};
}
function openSheet(id){
  const r=D.res.find(x=>x.id===id), lg=L(r.l), dlg=$('#dlg');
  const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lg.adr+', 63150 La Bourboule');
  const wa='https://wa.me/?text='+encodeURIComponent(lg.nom+' : '+r.nom+', du '+frS.format(pd(r.arr))+' au '+frS.format(pd(r.dep))+', '+r.pers+'. Tél. '+(r.tel||'à venir'));
  dlg.innerHTML=`<div class="sheet" role="document"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><h2>${esc(lg.nom)}</h2><button class="ic" id="cl" aria-label="Fermer">✕</button></div>
  <div>${r.new?'<span class="tag n">Nouvelle réservation</span> ':''}${r.cancel?'<span class="tag x">Annulée</span>':''}</div>
  <dl class="kv"><dt>Voyageur</dt><dd>${esc(r.nom)}</dd><dt>Arrivée</dt><dd>${fr.format(pd(r.arr))}</dd><dt>Départ</dt><dd>${fr.format(pd(r.dep))} (${nights(r)} nuit${nights(r)>1?'s':''})</dd><dt>Personnes</dt><dd>${r.pers}</dd>${r.note?`<dt>À savoir</dt><dd>${esc(r.note)}</dd>`:''}<dt>Adresse</dt><dd>${esc(lg.adr)}</dd></dl>
  <div class="phone" id="ph">${r.tel?esc(r.tel):'Téléphone à venir'}</div>
  <div class="acts">${r.tel?`<a class="btn" href="tel:${r.tel.replace(/\s/g,'')}">Appeler le voyageur</a>`:''}<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>${r.tel?'<button class="btn ghost" id="cp">Copier le numéro</button>':''}</div></div>`;
  dlg.showModal();
  $('#cl').onclick=()=>dlg.close(); dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
  if($('#cp'))$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(r.tel);$('#cp').textContent='Numéro copié'}catch(e){const s=getSelection(),g=document.createRange();g.selectNodeContents($('#ph'));s.removeAllRanges();s.addRange(g);$('#cp').textContent='Numéro sélectionné'}};
}
lockScreen();
</script>
